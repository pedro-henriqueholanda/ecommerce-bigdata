# =====================================================================
# Agente Flume "a1"
#   source TAILDIR (acompanha o log do gerador)
#     -> selector replicating (cada evento vai para os DOIS canais)
#        -> c_kafka -> KafkaSink  (stream para o Flink)
#        -> c_hdfs  -> HDFSSink   (logs brutos, particionados por dia)
# =====================================================================
a1.sources  = r1
a1.channels = c_kafka c_hdfs
a1.sinks    = k_kafka k_hdfs

# ---------------- Source: TAILDIR ----------------
# Guarda a posição de leitura em JSON -> se o Flume reiniciar, não relê nem perde linhas.
a1.sources.r1.type = TAILDIR
a1.sources.r1.positionFile = /data/flume/taildir_position.json
a1.sources.r1.filegroups = f1
a1.sources.r1.filegroups.f1 = /data/logs/events.log
a1.sources.r1.batchSize = 100
a1.sources.r1.channels = c_kafka c_hdfs
a1.sources.r1.selector.type = replicating

# ---------------- Canais (memória) ----------------
a1.channels.c_kafka.type = memory
a1.channels.c_kafka.capacity = 20000
a1.channels.c_kafka.transactionCapacity = 1000

a1.channels.c_hdfs.type = memory
a1.channels.c_hdfs.capacity = 20000
a1.channels.c_hdfs.transactionCapacity = 1000

# ---------------- Sink 1: Kafka (-> Flink) ----------------
a1.sinks.k_kafka.type = org.apache.flume.sink.kafka.KafkaSink
a1.sinks.k_kafka.channel = c_kafka
a1.sinks.k_kafka.kafka.bootstrap.servers = kafka:9092
a1.sinks.k_kafka.kafka.topic = eventos
a1.sinks.k_kafka.flumeBatchSize = 100
a1.sinks.k_kafka.kafka.producer.acks = 1
a1.sinks.k_kafka.kafka.producer.linger.ms = 10

# ---------------- Sink 2: HDFS (logs brutos) ----------------
# Um diretório por dia (dt=AAAA-MM-DD), arquivo novo a cada 60 s.
# Arquivos em escrita começam com "_" -> o Spark ignora arquivos incompletos.
a1.sinks.k_hdfs.type = hdfs
a1.sinks.k_hdfs.channel = c_hdfs
a1.sinks.k_hdfs.hdfs.path = hdfs://namenode:8020/data/raw/eventos/dt=%Y-%m-%d
a1.sinks.k_hdfs.hdfs.filePrefix = eventos
a1.sinks.k_hdfs.hdfs.fileSuffix = .json
a1.sinks.k_hdfs.hdfs.inUsePrefix = _
a1.sinks.k_hdfs.hdfs.fileType = DataStream
a1.sinks.k_hdfs.hdfs.writeFormat = Text
a1.sinks.k_hdfs.hdfs.rollInterval = 60
a1.sinks.k_hdfs.hdfs.rollSize = 0
a1.sinks.k_hdfs.hdfs.rollCount = 0
a1.sinks.k_hdfs.hdfs.batchSize = 100
a1.sinks.k_hdfs.hdfs.useLocalTimeStamp = true
